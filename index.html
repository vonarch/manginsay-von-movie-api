<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Collection</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 40px 20px;
  }
  .card {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    padding: 30px 40px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  h1 { text-align: center; margin-top: 0; }
  h2 { margin-bottom: 10px; }
  form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  input {
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    flex: 1;
    min-width: 120px;
  }
  input[name="year"] { flex: 0 0 80px; }
  button {
    padding: 6px 14px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f5f5f5;
    cursor: pointer;
  }
  button:hover { background: #e9e9e9; }
  #status { min-height: 20px; font-weight: bold; }
  #status.error { color: #b00020; }
  #status.success { color: #1a7a1a; }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
  }
  th { background: #f5f5f5; }
</style>
</head>
<body>
  <div class="card">
    <h1>Movie Collection</h1>

    <h2>Add Movie</h2>
    <form id="add-movie-form">
      <input type="text" name="title" placeholder="Title" required>
      <input type="text" name="genre" placeholder="Genre" required>
      <input type="number" name="year" placeholder="Year" required>
      <button type="submit">Add Movie</button>
    </form>
    <div id="status"></div>

    <h2>Movies</h2>
    <button id="load-movies-btn">Load Movies</button>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Genre</th>
          <th>Year</th>
        </tr>
      </thead>
      <tbody id="movies-body"></tbody>
    </table>
  </div>

<script>
  const API_URL = '/api/movies';
  const form = document.getElementById('add-movie-form');
  const statusEl = document.getElementById('status');
  const tbody = document.getElementById('movies-body');
  const loadBtn = document.getElementById('load-movies-btn');

  function setStatus(message, type) {
    statusEl.textContent = message;
    statusEl.className = type || '';
  }

  async function loadMovies() {
    try {
      const res = await fetch(API_URL);
      const movies = await res.json();
      renderMovies(movies);
    } catch (err) {
      setStatus('Failed to load movies.', 'error');
    }
  }

  function renderMovies(movies) {
    tbody.innerHTML = '';
    movies.forEach(movie => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${movie.id}</td>
        <td>${movie.title}</td>
        <td>${movie.genre}</td>
        <td>${movie.year}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const payload = {
      title: formData.get('title').trim(),
      genre: formData.get('genre').trim(),
      year: formData.get('year')
    };

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.error || 'Failed to add movie.', 'error');
        return;
      }

      setStatus('Movie added successfully', 'success');
      form.reset();
      loadMovies(); // refresh list after adding
    } catch (err) {
      setStatus('Failed to add movie.', 'error');
    }
  });

  loadBtn.addEventListener('click', loadMovies);

  // load movies on page load
  loadMovies();
</script>
</body>
</html>
